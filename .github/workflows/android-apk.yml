name: Android APK (debug — interim install proof)

# Distribution Leg 1 (distribution plan 2026-11-06 §3): generate the
# Capacitor Android project in the runner, build a DEBUG-signed APK, and
# upload it as a workflow artifact. Debug signing is for the interim
# install proof only — the release keystore is an owner-custody step and
# no release artifact is produced here.

on:
  workflow_dispatch:
  push:
    branches:
      - wright/sc-leg1-capacitor

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies (incl. Capacitor)
        run: npm install --no-audit --no-fund

      - name: Stage the app surface into www/
        run: node scripts/stage-www.mjs

      - name: Generate the Android project
        run: npx cap add android

      - name: Sync web assets into the Android project
        run: npx cap sync android

      - name: Build the debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sovereign-core-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
