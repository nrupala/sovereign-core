name: Build Sovereign Core

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install markdown jinja2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build docs
        run: npm run docs:build

      - name: Verify docs
        run: npm run docs:verify

      - name: Verify docs manifest
        run: |
          python scripts/verify-docs.py
